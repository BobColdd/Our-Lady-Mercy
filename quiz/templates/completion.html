<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Submitted</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .completion-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px;
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        
        .checkmark {
            font-size: 80px;
            color: #4caf50;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            font-size: 18px;
        }
        
        .student-name {
            color: #667eea;
            font-weight: bold;
        }
        
        .btn-home {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px 5px;
        }
        
        .btn-home:hover {
            background: #5a67d8;
        }
        
        .note {
            margin-top: 20px;
            padding: 15px;
            background: #fff3e0;
            border-radius: 8px;
            font-size: 14px;
            color: #e65100;
        }
    </style>
</head>
<body>
    <div class="completion-container">
        <div class="checkmark">✓</div>
        <h1>Done!</h1>
        
        <div class="message">
            Thank you, <span class="student-name">{{ student_name }}</span>!<br>
            {{ message }}
        </div>
        
        <div class="note">
            📝 <strong>Note:</strong> Your answers have been recorded.<br>
            The instructor will review your typed responses.
        </div>
        
        <a href="{{ url_for('login') }}" class="btn-home">Take Quiz Again</a>
    </div>
</body>
</html>
